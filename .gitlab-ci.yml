name: Fleet Deployment Pipeline

# This triggers the pipeline automatically every time you push code to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  validate-and-test:
    # This runs the pipeline inside GitHub's free cloud-hosted Linux containers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Run syntax validation check
        run: |
          echo "Testing pipeline trigger..."
          echo "Validating configuration files and deployment scripts."

  build-package:
    runs-on: ubuntu-latest
    needs: validate-and-test # This ensures the test pass before building
    
    steps:
      - name: Package installer bundle
        run: |
          echo "Packaging Orbit flags and deployment configurations..."
          echo "Bundle built successfully!"
